services:
  postgres:
    image: postgres:16-alpine
    container_name: motodesk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: motodesk_dev
      POSTGRES_DB: motodesk

    ports:
      - "5433:5432"

    volumes:
      - motodesk_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motodesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  motodesk_postgres_data:

